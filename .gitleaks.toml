[extend]
useDefault = true

# This exact value is the verified SHA-256 of the public RustAuth probe source,
# recorded as measurement provenance. Keep other values and files fully scanned.
[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Exact public probe source checksum, not an API credential"
condition = "AND"
paths = ['''(^|/)benchmarks/adoption/results/2026-10-19(-under-load)?/environment\.json$''']
regexTarget = "line"
regexes = ['''^\s*"src/rustauth\.rs": "0a8bd5cf18a1b5757cd3759654e08220325bd5eb246f4851ed06de3ffb884aa3"\s*,?\s*$''']

# Only exact, public upstream vector contents are exempted; other values in
# these same files remain scanned. Source hashes are checked separately in CI.

[[rules.allowlists]]
description = "Exact public saml-rs package vector; upstream provenance and source hashes retained"
condition = "AND"
paths = ['''(^|/)third-party/saml-rs/tests/fixtures/idpmeta\.xml$''']
regexTarget = "match"
regexes = [
    '''\AKeyInfo ID="SM4cee9750ee17bb2f60ddbe556a2798218f7a5bbed"\z''',
]


[workspace]
members = ["crates/auth-core", "crates/auth-postgres", "crates/auth-axum", "apps/auth-server"]
resolver = "2"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
auth-core = { package = "easy-auth-core", path = "crates/auth-core" }
auth-postgres = { package = "easy-auth-postgres", path = "crates/auth-postgres" }
auth-axum = { package = "easy-auth-axum", path = "crates/auth-axum" }
async-trait = "0.1"
argon2 = { version = "0.5.3", features = ["zeroize"] }
axum = "0.8"
base64 = "0.22"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
unicode-normalization = "0.1.24"
zeroize = "1"
ipnet = "=2.12.2"
josekit = { version = "=0.10.3", default-features = false }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1.0.10"
webauthn-rs = { version = "=0.5.5", default-features = false, features = ["danger-allow-state-serialisation", "conditional-ui"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
strip = true

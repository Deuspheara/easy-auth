[package]
name = "easy-auth-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
google = ["oidc-verification"]
oidc-identities = ["oidc-verification"]
oidc-verification = ["oidc-egress", "dep:josekit"]
oidc-egress = ["oauth-transactions", "dep:ipnet", "dep:serde_json"]
oauth-transactions = ["dep:url"]
passkeys = ["dep:webauthn-rs", "dep:serde_json", "dep:url", "dep:tracing"]

[dependencies]
josekit = { workspace = true, optional = true }
ipnet = { workspace = true, optional = true }
async-trait.workspace = true
argon2.workspace = true
base64.workspace = true
rand.workspace = true
serde.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
unicode-normalization.workspace = true
uuid.workspace = true
zeroize.workspace = true
webauthn-rs = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
url = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

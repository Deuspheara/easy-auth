<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>easy-auth alpha</title>
<body><main><h1>Sign in</h1><p>Development reference client. Email sign-in requires opening the link in this browser.</p>
<form id="email-form"><label for="email">Email</label> <input id="email" type="email" autocomplete="email" required maxlength="254"><button id="submit">Send sign-in link</button> <button id="reset-request" type="button">Reset password</button></form>
<p id="status" role="status" aria-live="polite"></p><pre id="identity"></pre><button id="logout" hidden>Sign out</button>
<p>Alpha: email proof and revocable sessions. Headless password APIs are optional; other authentication methods are planned.</p></main><script src="/client.js" defer></script></body></html>

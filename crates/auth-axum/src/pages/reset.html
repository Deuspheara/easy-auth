<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Reset password · easy-auth alpha</title>
<body><main><h1>Reset password</h1><p>Use 15–256 characters. Spaces and Unicode are allowed. Avoid common or compromised passwords.</p>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Google sign-in</title><script type="module" src="/google/client.js"></script></head>
<body data-flow="signin"><main><h1>Sign in with Google</h1>
<p id="status" role="status">Preparing sign-in…</p>
<form id="confirm-form" hidden><button id="continue" type="submit">Continue</button></form>
<button id="cancel" type="button">Cancel pending sign-in</button>
<p>Sign out of any current account before starting. A Google redirect does not confirm local sign-in. If completion is interrupted, check your session before restarting.</p>
</main></body></html>

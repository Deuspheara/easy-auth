<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Apple sign-in</title><!-- reference-style --><script src="/apple/client.js" defer></script></head>
<body><a class="skip" href="#main">Skip to content</a><main id="main" tabindex="-1">
<h1>Sign in with Apple</h1>
<p id="status" role="status" class="alert">Sign out of any current account before starting.</p>
<form id="confirm" method="post" hidden><button id="continue" class="btn" type="submit">Continue to Apple</button></form>

<noscript>JavaScript is required for this sign-in journey.</noscript>

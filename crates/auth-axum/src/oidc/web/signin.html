<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Provider sign-in</title><script type="module" src="/oidc/sign-in.js"></script></head>
<body><main><h1>Sign in with your configured provider</h1>
<p id="status" role="status">Preparing sign-in…</p>
<form id="signin-form" hidden><button id="continue" type="submit">Continue</button></form>
<button id="cancel" type="button">Cancel pending sign-in</button>
<p>Sign out of any current account before starting. A provider redirect alone does not confirm sign-in. If completion is interrupted, check your session before starting again.</p>
</main></body></html>

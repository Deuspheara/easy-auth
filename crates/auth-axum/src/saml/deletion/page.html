<!doctype html><html lang="en"><meta charset="utf-8"><title>Delete account</title>
<body><h1>Delete your account</h1><p>Deleting your local account removes its credentials and sessions. Your identity provider account remains.</p>
<p>Type <strong>delete my account</strong> to continue to provider reauthentication. You must confirm again after returning.</p>
<form id="delete-start"><label>Confirmation <input name="confirmation" autocomplete="off" required></label><button type="submit">Continue to reauthentication</button></form>
<button id="cancel" type="button">Cancel pending deletion</button><p id="status" role="status"></p><a href="/">Return</a><script src="/saml/account-delete.js" defer></script></body></html>

[package]
name = "easy-auth-axum"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
issuer-native-web = ["issuer-token-management-web", "issuer-native-consent-web"]
issuer-native-consent-web = ["issuer-consent-web", "auth-core/issuer-native-refresh", "auth-postgres/issuer-native-refresh"]
issuer-token-management-web = ["issuer-web", "auth-core/issuer-token-management", "auth-postgres/issuer-token-management"]
issuer-web = ["issuer-consent-web", "auth-core/issuer-signing", "auth-postgres/issuer-signing", "dep:base64", "dep:zeroize"]
issuer-consent-web = ["auth-core/issuer-codes", "auth-postgres/issuer-codes"]
saml-web = ["auth-core/saml-identities", "auth-postgres/saml-identities"]
google-web = ["oidc-web", "auth-core/google"]
oidc-web = ["oidc-account-deletion"]
oidc-account-deletion = ["auth-core/oidc-identities", "auth-postgres/oidc-identities"]
passkey-enrollment = ["auth-core/passkeys", "auth-postgres/passkeys"]
passkey-authentication = ["passkey-enrollment"]
passkey-signup = ["passkey-authentication"]
passkey-management = ["passkey-signup"]
passkey-recovery-setup = ["passkey-management"]
passkey-recovery = ["passkey-recovery-setup"]

[dependencies]
base64 = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }
auth-core.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true

utoipa = { version = "5", features = ["uuid"] }

[dev-dependencies]
saml-rs.workspace = true
openssl.workspace = true
base64.workspace = true
josekit.workspace = true
auth-postgres.workspace = true
async-trait.workspace = true
http-body-util = "0.1"
sqlx.workspace = true
tower = { version = "0.5", features = ["util"] }
webauthn-authenticator-rs = { version = "=0.5.5", default-features = false, features = ["softtoken"] }

[[example]]
name = "passkey-browser"
path = "examples/passkey-browser/main.rs"
required-features = ["passkey-signup"]

[[example]]
name = "export_passkey_openapi"
required-features = ["passkey-enrollment"]

[[example]]
name = "export_passkey_authentication_openapi"
required-features = ["passkey-authentication"]

[[example]]
name = "export_passkey_signup_openapi"
required-features = ["passkey-signup"]

[[example]]
name = "export_passkey_management_openapi"
required-features = ["passkey-management"]

[[example]]
name = "export_passkey_recovery_setup_openapi"
required-features = ["passkey-recovery-setup"]

[[example]]
name = "export_passkey_recovery_openapi"
required-features = ["passkey-recovery"]

[[example]]
name = "export_oidc_account_deletion_openapi"
required-features = ["oidc-account-deletion"]

[[example]]
name = "export_oidc_web_openapi"
required-features = ["oidc-web"]

[[example]]
name = "export_google_web_openapi"
required-features = ["google-web"]

[[example]]
name = "google-web-browser"
path = "examples/google-web-browser/main.rs"
required-features = ["google-web"]

[[example]]
name = "saml-web-browser"
path = "examples/saml-web-browser/main.rs"
required-features = ["saml-web"]

[[example]]
name = "export_saml_web_openapi"
required-features = ["saml-web"]

[[example]]
name = "export_saml_account_deletion_web_openapi"
required-features = ["saml-web"]

[[example]]
name = "saml-keycloak-browser"
path = "examples/saml-keycloak-browser/main.rs"
required-features = ["saml-web"]

[[example]]
name = "issuer-consent-browser"
path = "examples/issuer-consent-browser/main.rs"
required-features = ["issuer-consent-web"]

[[example]]
name = "issuer-web-browser"
path = "examples/issuer-web-browser/main.rs"
required-features = ["issuer-web"]

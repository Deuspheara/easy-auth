[package]
name = "easy-auth-postgres"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
issuer-signing = ["issuer-codes", "auth-core/issuer-signing", "dep:serde_json", "sqlx/json"]
issuer-codes = ["issuer-clients", "auth-core/issuer-codes"]
issuer-clients = ["auth-core/issuer-clients"]
saml-identities = ["saml-verification", "auth-core/saml-identities"]
saml-verification = ["saml-certificates", "auth-core/saml-verification"]
saml-certificates = ["saml-requests", "auth-core/saml-certificates"]
saml-requests = ["auth-core/saml-requests"]
google = ["oidc-identities", "auth-core/google"]
oidc-identities = ["oidc-verification", "auth-core/oidc-identities"]
oidc-verification = ["oidc-egress", "auth-core/oidc-verification"]
oidc-egress = ["oauth-transactions", "auth-core/oidc-egress"]
oauth-transactions = ["auth-core/oauth-transactions"]
passkeys = ["auth-core/passkeys"]

[dependencies]
serde_json = { workspace = true, optional = true }
auth-core.workspace = true
async-trait.workspace = true
sqlx.workspace = true
uuid.workspace = true

[dev-dependencies]
saml-rs.workspace = true
openssl.workspace = true
josekit.workspace = true
tokio.workspace = true
webauthn-authenticator-rs = { version = "=0.5.5", default-features = false, features = ["softtoken"] }
url.workspace = true
serde_json.workspace = true
serde_cbor_2 = "0.13"

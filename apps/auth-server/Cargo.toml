[package]
name = "easy-auth-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
oidc-web = ["oidc-identities", "auth-axum/oidc-web"]
experimental-oidc-account-deletion = ["oidc-identities", "auth-axum/oidc-account-deletion"]
oidc-identities = ["oidc-verification", "auth-core/oidc-identities", "auth-postgres/oidc-identities"]
oidc-verification = ["oidc-egress", "auth-core/oidc-verification", "auth-postgres/oidc-verification"]
oidc-egress = ["auth-core/oidc-egress", "auth-postgres/oidc-egress", "dep:reqwest", "dep:rustls", "dep:webpki-roots"]
experimental-passkey-recovery = ["experimental-passkeys", "auth-axum/passkey-recovery"]
experimental-passkeys = ["auth-axum/passkey-recovery-setup", "auth-core/passkeys", "auth-postgres/passkeys"]

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true
rcgen = { version = "=0.14.10", default-features = false, features = ["ring", "zeroize"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[dependencies]
reqwest = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }
zeroize.workspace = true
auth-core.workspace = true
auth-postgres.workspace = true
auth-axum.workspace = true
async-trait.workspace = true
axum.workspace = true
sqlx.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
url.workspace = true
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls", "ring", "webpki-roots"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bin]]
name = "easy-auth"
path = "src/main.rs"

[[example]]
name = "passkey-smtp-browser"
path = "examples/passkey-smtp-browser/main.rs"
required-features = ["experimental-passkeys"]

[[example]]
name = "passkey-recovery-browser"
path = "examples/passkey-recovery-browser/main.rs"
required-features = ["experimental-passkey-recovery"]

[[example]]
name = "oidc-keycloak"
path = "examples/oidc-keycloak/main.rs"
required-features = ["oidc-verification"]

[[example]]
name = "oidc-deletion-http"
path = "examples/oidc-deletion-http/main.rs"
required-features = ["experimental-oidc-account-deletion"]

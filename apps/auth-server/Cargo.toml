[package]
name = "easy-auth-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
issuer-signing = ["auth-core/issuer-signing", "dep:libc"]
saml-web = ["auth-core/saml-identities", "auth-postgres/saml-identities", "auth-axum/saml-web"]
google-desktop-launch = ["google-desktop", "tokio/process", "dep:open"]
google-desktop = ["oidc-verification", "auth-core/google", "dep:hyper", "dep:hyper-util"]
oidc-web = ["oidc-identities", "auth-axum/oidc-web"]
experimental-oidc-account-deletion = ["oidc-identities", "auth-axum/oidc-account-deletion"]
oidc-identities = ["oidc-verification", "auth-core/oidc-identities", "auth-postgres/oidc-identities"]
oidc-verification = ["oidc-egress", "auth-core/oidc-verification", "auth-postgres/oidc-verification"]
oidc-egress = ["auth-core/oidc-egress", "auth-postgres/oidc-egress", "dep:reqwest", "dep:rustls", "dep:webpki-roots"]
experimental-passkey-recovery = ["experimental-passkeys", "auth-axum/passkey-recovery"]
experimental-passkeys = ["auth-axum/passkey-recovery-setup", "auth-core/passkeys", "auth-postgres/passkeys"]

[dev-dependencies]
base64.workspace = true
josekit.workspace = true
serde.workspace = true
serde_json.workspace = true
rcgen = { version = "=0.14.10", default-features = false, features = ["ring", "zeroize"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows"))'.dependencies]
open = { version = "=5.4.4", default-features = false, optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "=0.2.191", optional = true }

[dependencies]
hyper = { version = "1", features = ["http1", "server"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
reqwest = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }
zeroize.workspace = true
auth-core.workspace = true
auth-postgres.workspace = true
auth-axum.workspace = true
async-trait.workspace = true
axum.workspace = true
sqlx.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
url.workspace = true
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls", "ring", "webpki-roots"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bin]]
name = "easy-auth"
path = "src/main.rs"

[[example]]
name = "passkey-smtp-browser"
path = "examples/passkey-smtp-browser/main.rs"
required-features = ["experimental-passkeys"]

[[example]]
name = "passkey-recovery-browser"
path = "examples/passkey-recovery-browser/main.rs"
required-features = ["experimental-passkey-recovery"]

[[example]]
name = "oidc-keycloak"
path = "examples/oidc-keycloak/main.rs"
required-features = ["oidc-verification"]

[[example]]
name = "oidc-deletion-http"
path = "examples/oidc-deletion-http/main.rs"
required-features = ["experimental-oidc-account-deletion"]

[[example]]
name = "google-desktop-browser"
path = "examples/google-desktop-browser.rs"
required-features = ["google-desktop"]

[[example]]
name = "google-provider-preflight"
path = "examples/google-provider-preflight/main.rs"
required-features = ["google-desktop"]

[[example]]
name = "google-native-acceptance"
path = "examples/google-native-acceptance/main.rs"
required-features = ["google-desktop-launch", "oidc-identities"]

[[example]]
name = "oidc-web-native"
path = "examples/oidc-web-native/main.rs"
required-features = ["oidc-web"]

[[example]]
name = "saml-startup-provision"
path = "examples/saml-startup-provision.rs"
required-features = ["saml-web"]

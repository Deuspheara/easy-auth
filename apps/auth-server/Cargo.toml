[package]
name = "easy-auth-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
experimental-passkeys = ["auth-axum/passkey-recovery-setup", "auth-core/passkeys", "auth-postgres/passkeys"]

[dev-dependencies]
serde_json.workspace = true

[dependencies]
zeroize.workspace = true
auth-core.workspace = true
auth-postgres.workspace = true
auth-axum.workspace = true
async-trait.workspace = true
axum.workspace = true
sqlx.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
url.workspace = true
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls", "ring", "webpki-roots"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bin]]
name = "easy-auth"
path = "src/main.rs"

[[example]]
name = "passkey-smtp-browser"
path = "examples/passkey-smtp-browser/main.rs"
required-features = ["experimental-passkeys"]

# Replace auth.example.invalid with the operator's exact public hostname.
# Keep SAML route blocks until the separately approved activation change.
worker_processes 1;
worker_shutdown_timeout 20s;
pid /tmp/nginx.pid;
error_log /dev/null crit;
events { worker_connections 128; }
http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    limit_conn_zone $server_name zone=server_connections:1m;
    limit_req_zone $server_name zone=server_requests:1m rate=10r/s;
    server {
        listen 8443 ssl default_server;
        server_name _;
        ssl_certificate /run/tls/certificate.pem;
        ssl_certificate_key /run/tls/private-key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        return 444;
    }
    server {
        listen 8443 ssl;
        server_name auth.example.invalid;
        ssl_certificate /run/tls/certificate.pem;
        ssl_certificate_key /run/tls/private-key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 800k;
        client_body_buffer_size 800k;
        client_header_timeout 10s;
        client_body_timeout 10s;
        send_timeout 15s;
        keepalive_timeout 10s;
        keepalive_requests 100;
        limit_conn server_connections 64;
        limit_conn_status 429;
        limit_req zone=server_requests burst=20 nodelay;
        limit_req_status 429;
        location ^~ /saml/ { return 404; }
        location ^~ /v1/saml/ { return 404; }
        location / {
            proxy_pass http://auth:8080;
            proxy_http_version 1.1;
            proxy_set_header Host auth.example.invalid;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_connect_timeout 3s;
            proxy_send_timeout 10s;
            proxy_read_timeout 45s;
        }
    }
}

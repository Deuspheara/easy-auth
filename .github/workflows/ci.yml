name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      mailpit:
        image: axllent/mailpit:v1.27
        ports: ["1025:1025", "8025:8025"]
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: auth
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: auth
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U auth -d auth" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://auth:ci-only-password@localhost:5432/auth
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - name: Install native WebAuthn and gated SAML build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config cmake
      - name: Identify dependency cache environment
        id: cache-environment
        run: |
          python3 - <<'PYTHON'
          import hashlib, os, subprocess
          image = [os.environ.get("ImageOS"), os.environ.get("ImageVersion")]
          metadata = None
          if all(image):
              try:
                  compiler = subprocess.check_output(["rustc", "-vV"], text=True)
                  native = subprocess.check_output(["dpkg-query", "-W", "-f=${binary:Package}=${Version}\n", "libssl-dev", "pkg-config", "cmake", "gcc", "g++", "libc6-dev"], text=True)
                  metadata = "\n".join([*image, compiler, native])
              except (OSError, subprocess.CalledProcessError):
                  pass  # Cache metadata failure falls back to the normal cold checks.
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              if metadata is not None:
                  print("available=true", file=output)
                  print("fingerprint=" + hashlib.sha256(metadata.encode()).hexdigest(), file=output)
              else:
                  print("available=false", file=output)
          PYTHON
          printf '%s\n' "$RUNNER_TEMP/easy-auth-security-tools/bin" >> "$GITHUB_PATH"
      - name: Reuse dependency builds and security tools on trusted pushes
        if: github.event_name == 'push' && steps.cache-environment.outputs.available == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/debug/.fingerprint
            target/debug/build
            target/debug/deps
            ${{ runner.temp }}/easy-auth-security-tools
          key: rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-environment.outputs.fingerprint }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', '.cargo/**', 'third-party/saml-rs-source.json', 'tests/provider/saml/rust-policy/patches/*.patch') }}-${{ github.sha }}
          restore-keys: |
            rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-environment.outputs.fingerprint }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', '.cargo/**', 'third-party/saml-rs-source.json', 'tests/provider/saml/rust-policy/patches/*.patch') }}-
      - run: python3 scripts/check_saml_source.py
      - run: python3 -m unittest scripts.test_saml_source
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo test --locked --workspace --all-features
      - name: Qualify maintained SAML and C14N against the selected shipped graph
        run: |
          python3 -m unittest scripts.test_saml_qualification
          python3 scripts/qualify_saml_c14n.py
      - name: Verify outbound client metadata without provider activation
        run: |
          cargo test --locked -p easy-auth-core --features issuer-clients issuer::
          cargo test --locked -p easy-auth-postgres --features issuer-clients --test lifecycle issuer::
      - name: Verify issuer codes without optional provider backends
        run: |
          cargo test --locked -p easy-auth-core --features issuer-codes issuer::
          cargo test --locked -p easy-auth-postgres --features issuer-codes --test lifecycle issuer_codes
      - name: Verify isolated issuer HTTPS consent boundary
        run: cargo test --locked -p easy-auth-axum --features issuer-consent-web --test browser issuer_consent
      - name: Verify isolated signed issuer and client token transport
        run: |
          cargo test --locked -p easy-auth-core --features issuer-signing issuer::
          cargo test --locked -p easy-auth-postgres --features issuer-signing --test lifecycle issuer_signing
          cargo test --locked -p easy-auth-axum --features issuer-web --test browser issuer_web
          cargo test --locked -p easy-auth-server --features issuer-signing issuer_key::
      - name: Verify isolated native consent, issuance and refresh families
        run: |
          cargo test --locked -p easy-auth-postgres --features issuer-clients,auth-core/issuer-native-refresh --test lifecycle issuer::native_refresh_unavailable
          cargo test --locked -p easy-auth-core --features issuer-native-refresh issuer::tokens::native
          cargo test --locked -p easy-auth-postgres --features issuer-native-refresh --test lifecycle issuer_native_refresh
          cargo check --locked -p easy-auth-axum --features issuer-native-consent-web
          cargo test --locked -p easy-auth-axum --features issuer-native-consent-web,issuer-web --test browser issuer_native_consent
          cargo test --locked -p easy-auth-axum --features issuer-native-web --test browser issuer_native_web
      - name: Verify isolated access revocation and authenticated introspection
        run: |
          cargo test --locked -p easy-auth-core --features issuer-token-management issuer::tokens
          cargo test --locked -p easy-auth-postgres --features issuer-token-management --test lifecycle token_status
          cargo test --locked -p easy-auth-axum --features issuer-token-management-web --test browser issuer_web
      - name: Verify independent Rust client and configured issuer startup
        run: |
          cargo test --locked -p easy-auth-core --features oidc-client oidc::verification::tests::client
          cargo test --locked -p easy-auth-server --features issuer-web,oidc-client application::issuer
          cargo test --locked -p easy-auth-server --features issuer-web,oidc-client configuration::issuer
          cargo test --locked -p easy-auth-server --features oidc-client oidc_http::
          cargo check --locked -p easy-auth-axum --features issuer-native-web,oidc-web
          cargo check --locked -p easy-auth-axum --features issuer-native-web,saml-web
      - name: Verify OIDC without optional local identity mapping
        run: cargo test --locked -p easy-auth-core --features oidc-verification
      - name: Verify Google without optional local identity mapping
        run: cargo test --locked -p easy-auth-core --features google
      - name: Verify gated SAML requests without a cryptographic provider
        run: |
          cargo test --locked -p easy-auth-core --features saml-requests saml::
          cargo test --locked -p easy-auth-postgres --features saml-requests --test lifecycle saml::
      - name: Verify gated SAML certificate configuration without XML signature activation
        run: |
          cargo test --locked -p easy-auth-core --features saml-certificates saml::
          cargo test --locked -p easy-auth-postgres --features saml-certificates --test lifecycle saml::
      - name: Verify concrete gated SAML verification without other providers
        run: |
          cargo test --locked -p easy-auth-core --features saml-verification saml::
          cargo test --locked -p easy-auth-postgres --features saml-verification --test lifecycle saml::
      - name: Verify gated SAML identity policy without other providers
        run: |
          cargo test --locked -p easy-auth-core --features saml-identities saml::
          cargo test --locked -p easy-auth-postgres --features saml-identities --test lifecycle saml::
      - name: Verify Google PostgreSQL integration without passkeys
        run: cargo test --locked -p easy-auth-postgres --features google --test lifecycle oidc::google
      - name: Verify stable native OAuth registration without passkeys
        run: cargo test --locked -p easy-auth-postgres --features google --test lifecycle oauth::desktop
      - name: Verify Google desktop transport without local identity mapping
        run: cargo test --locked -p easy-auth-server --features google-desktop google_desktop
      - name: Verify Google native launcher without local identity mapping
        run: cargo test --locked -p easy-auth-server --features google-desktop-launch --lib google_desktop
      - name: Verify owned Google native process and PostgreSQL acceptance
        run: cargo test --locked -p easy-auth-server --features google-desktop-launch,oidc-identities --lib google_desktop::operation
      - name: Verify Google manual acceptance composition without opening a browser
        run: cargo test --locked -p easy-auth-server --example google-native-acceptance --features google-desktop-launch,oidc-identities
      - name: Verify owned Google desktop PostgreSQL acceptance
        run: cargo test --locked -p easy-auth-server --features google-desktop,oidc-identities --test google_desktop
      - name: Verify Google HTTPS boundary without passkeys
        run: cargo test --locked -p easy-auth-axum --features google-web --test browser google_web
      - name: Verify gated SAML HTTP without unrelated providers
        run: |
          cargo test --locked -p easy-auth-axum --features saml-web --test browser saml::
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/browser/passkeys/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: tests/browser/passkeys
      - run: npm audit --audit-level=low
        working-directory: tests/browser/passkeys
      - run: npx --no-install playwright install --with-deps chromium
        working-directory: tests/browser/passkeys
      - name: Verify owned issuer HTTPS consent and browser recovery
        run: |
          cargo build --locked -p easy-auth-axum --features issuer-consent-web --example issuer-consent-browser
          node tests/browser/issuer-consent/run.cjs
      - name: Verify owned signed issuer browser and separate HTTPS client
        run: |
          cargo build --locked -p easy-auth-axum --features issuer-web --example issuer-web-browser
          node tests/browser/issuer-web/run.cjs
      - name: Verify owned native issuer browser, loopback and refresh lifecycle
        run: |
          cargo build --locked -p easy-auth-axum --features issuer-native-web --example issuer-web-browser
          node tests/browser/issuer-native/run.cjs
      - name: Verify actual standalone and embedded issuer client parity
        run: |
          cargo build --locked -p easy-auth-server --features issuer-web,oidc-client --bin easy-auth --example issuer-client-acceptance
          node tests/browser/issuer-standalone/run.cjs
      - run: node tests/browser/oidc/deletion-client.cjs
      - name: Verify owned Google desktop browser return
        run: |
          cargo build --locked -p easy-auth-server --features google-desktop --example google-desktop-browser
          node tests/browser/google-desktop/run.cjs
      - name: Verify owned Google HTTPS browser flow
        run: |
          cargo build --locked -p easy-auth-axum --features google-web --example google-web-browser
          node tests/browser/google-web/run.cjs
      - name: Verify owned SAML HTTPS POST browser flow
        run: |
          cargo build --locked -p easy-auth-axum --features saml-web --example saml-web-browser
          node tests/browser/saml-web/run.cjs
      - name: Verify actual Keycloak SAML rollover and realm isolation
        run: |
          cargo build --locked -p easy-auth-axum --features saml-web --example saml-keycloak-browser
          node tests/browser/saml-keycloak/run.cjs
      - name: Verify actual Keycloak SAML confirmed account deletion
        run: node tests/browser/saml-keycloak/run.cjs --account-deletion
      - run: node tests/browser/oidc/signin-client.cjs
      - name: Build and check supported OIDC startup composition
        run: |
          cargo build --locked -p easy-auth-server --bin easy-auth
          cp target/debug/easy-auth "$RUNNER_TEMP/easy-auth-oidc-disabled"
          cargo build --locked -p easy-auth-server --bin easy-auth --example embedded --features oidc-web
          python3 scripts/smoke_oidc_startup.py
        env:
          EASY_AUTH_OIDC_UNSUPPORTED_TEST_BINARY: ${{ runner.temp }}/easy-auth-oidc-disabled
          EASY_AUTH_SMOKE_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
      - name: Verify opt-in SAML startup, trusted configuration and isolation
        run: |
          cargo build --locked -p easy-auth-server --bin easy-auth --example embedded --example saml-startup-provision --features saml-web,oidc-web
          python3 scripts/smoke_saml_startup.py
          cargo check --locked -p easy-auth-server --all-targets --features saml-web
        env:
          EASY_AUTH_SAML_UNSUPPORTED_TEST_BINARY: ${{ runner.temp }}/easy-auth-oidc-disabled
          EASY_AUTH_SMOKE_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
      - name: Record gated SAML build and native provenance
        run: python3 scripts/record_saml_native.py
      - run: cargo check --locked -p easy-auth-server --example oidc-keycloak --features oidc-verification
      - run: cargo build --locked -p easy-auth-server --example oidc-keycloak --features oidc-identities
      - run: node tests/browser/oidc/run.cjs
        env:
          EASY_AUTH_OIDC_IDENTITIES: '1'
      - run: cargo build --locked -p easy-auth-server --example oidc-deletion-http --features experimental-oidc-account-deletion
      - run: node tests/browser/oidc/http-deletion/run.cjs
      - run: cargo build --locked -p easy-auth-server --example oidc-web-native --features oidc-web
      - run: node tests/browser/oidc/web/run.cjs
      - run: cargo build --locked -p easy-auth-axum --example passkey-browser --features passkey-signup
      - run: node tests/browser/passkeys/run.cjs
      - run: cargo build --locked -p easy-auth-server --example passkey-smtp-browser --features experimental-passkeys
      - run: node tests/browser/passkeys/attachment/run.cjs
      - run: cargo build --locked -p easy-auth-server --example passkey-recovery-browser --features experimental-passkey-recovery
      - run: node tests/browser/passkeys/recovery/run.cjs
      - name: Verify reference account UI with real PostgreSQL, SMTP and native passkeys
        run: node tests/browser/reference-ui/run.cjs
      - run: cargo build --locked -p easy-auth-server --bin easy-auth
      - run: python3 scripts/smoke_recovery_notice.py
        env:
          EASY_AUTH_SMOKE_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
      - run: cargo install cargo-audit --locked --root "$RUNNER_TEMP/easy-auth-security-tools"
      - run: python3 scripts/audit.py
      - run: cargo install cargo-deny --locked --root "$RUNNER_TEMP/easy-auth-security-tools"
      - run: cargo deny --all-features check
      - name: Retain only dependency build outputs in the cache
        if: github.event_name == 'push' && steps.cache-environment.outputs.available == 'true'
        run: cargo clean -p easy-auth-core -p easy-auth-postgres -p easy-auth-axum -p easy-auth-server
  saml-release:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: auth
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: auth
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U auth -d auth" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://auth:ci-only-password@localhost:5432/auth
    steps:
      - uses: actions/checkout@v4
      - name: Build opt-in native SAML release
        run: docker build --progress=plain -f deploy/saml/Dockerfile --build-arg "SOURCE_REVISION=$GITHUB_SHA" -t easy-auth-saml-release:ci .
      - name: Build bounded TLS proxy with SAML forwarding
        run: docker build --progress=plain -f deploy/saml/proxy.Dockerfile --build-arg "SOURCE_REVISION=$GITHUB_SHA" -t easy-auth-saml-proxy:ci .
      - name: Verify private build-context exclusion with owned non-secret markers
        run: python3 scripts/check_saml_build_context.py
      - name: Verify actual release startup, native inventory and enforced resource configuration
        run: python3 scripts/check_saml_release.py --image easy-auth-saml-release:ci --proxy-image easy-auth-saml-proxy:ci
        env:
          EASY_AUTH_SMOKE_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
      - name: Assess all image advisory severities and gate high or critical findings
        run: python3 scripts/scan_saml_release.py --image easy-auth-saml-release:ci --proxy-image easy-auth-saml-proxy:ci
      - name: Retain exact-source release review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saml-reference-release-${{ github.sha }}
          path: |
            target/saml-release-inventory.json
            target/saml-build-context.json
            target/saml-release-advisories/auth.json
            target/saml-release-advisories/proxy.json
            target/saml-release-advisories/summary.json
          retention-days: 14
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/check_saml_source.py
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

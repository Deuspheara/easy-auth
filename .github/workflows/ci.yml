name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: auth
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: auth
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U auth -d auth" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://auth:ci-only-password@localhost:5432/auth
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - name: Install native WebAuthn build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo test --locked --workspace --all-features
      - run: cargo install cargo-audit --locked
      - run: python3 scripts/audit.py
      - run: cargo install cargo-deny --locked
      - run: cargo deny --all-features check
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

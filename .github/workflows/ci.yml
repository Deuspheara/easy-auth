name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      mailpit:
        image: axllent/mailpit:v1.27
        ports: ["1025:1025", "8025:8025"]
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: auth
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: auth
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U auth -d auth" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://auth:ci-only-password@localhost:5432/auth
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - name: Install native WebAuthn and gated SAML build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config cmake
      - run: python3 scripts/check_saml_source.py
      - run: python3 -m unittest scripts.test_saml_source
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo test --locked --workspace --all-features
      - name: Verify OIDC without optional local identity mapping
        run: cargo test --locked -p easy-auth-core --features oidc-verification
      - name: Verify Google without optional local identity mapping
        run: cargo test --locked -p easy-auth-core --features google
      - name: Verify gated SAML requests without a cryptographic provider
        run: |
          cargo test --locked -p easy-auth-core --features saml-requests saml::
          cargo test --locked -p easy-auth-postgres --features saml-requests --test lifecycle saml::
      - name: Verify gated SAML certificate configuration without XML signature activation
        run: |
          cargo test --locked -p easy-auth-core --features saml-certificates saml::
          cargo test --locked -p easy-auth-postgres --features saml-certificates --test lifecycle saml::
      - name: Verify concrete gated SAML verification without other providers
        run: |
          cargo test --locked -p easy-auth-core --features saml-verification saml::
          cargo test --locked -p easy-auth-postgres --features saml-verification --test lifecycle saml::
      - name: Verify gated SAML identity policy without other providers
        run: |
          cargo test --locked -p easy-auth-core --features saml-identities saml::
          cargo test --locked -p easy-auth-postgres --features saml-identities --test lifecycle saml::
      - name: Verify Google PostgreSQL integration without passkeys
        run: cargo test --locked -p easy-auth-postgres --features google --test lifecycle oidc::google
      - name: Verify stable native OAuth registration without passkeys
        run: cargo test --locked -p easy-auth-postgres --features google --test lifecycle oauth::desktop
      - name: Verify Google desktop transport without local identity mapping
        run: cargo test --locked -p easy-auth-server --features google-desktop google_desktop
      - name: Verify Google native launcher without local identity mapping
        run: cargo test --locked -p easy-auth-server --features google-desktop-launch --lib google_desktop
      - name: Verify owned Google native process and PostgreSQL acceptance
        run: cargo test --locked -p easy-auth-server --features google-desktop-launch,oidc-identities --lib google_desktop::operation
      - name: Verify Google manual acceptance composition without opening a browser
        run: cargo test --locked -p easy-auth-server --example google-native-acceptance --features google-desktop-launch,oidc-identities
      - name: Verify owned Google desktop PostgreSQL acceptance
        run: cargo test --locked -p easy-auth-server --features google-desktop,oidc-identities --test google_desktop
      - name: Verify Google HTTPS boundary without passkeys
        run: cargo test --locked -p easy-auth-axum --features google-web --test browser google_web
      - name: Verify gated SAML HTTP without unrelated providers
        run: |
          cargo test --locked -p easy-auth-axum --features saml-web --test browser saml::
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/browser/passkeys/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: tests/browser/passkeys
      - run: npm audit --audit-level=low
        working-directory: tests/browser/passkeys
      - run: npx --no-install playwright install --with-deps chromium
        working-directory: tests/browser/passkeys
      - run: node tests/browser/oidc/deletion-client.cjs
      - name: Verify owned Google desktop browser return
        run: |
          cargo build --locked -p easy-auth-server --features google-desktop --example google-desktop-browser
          node tests/browser/google-desktop/run.cjs
      - name: Verify owned Google HTTPS browser flow
        run: |
          cargo build --locked -p easy-auth-axum --features google-web --example google-web-browser
          node tests/browser/google-web/run.cjs
      - name: Verify owned SAML HTTPS POST browser flow
        run: |
          cargo build --locked -p easy-auth-axum --features saml-web --example saml-web-browser
          node tests/browser/saml-web/run.cjs
      - name: Verify actual Keycloak SAML rollover and realm isolation
        run: |
          cargo build --locked -p easy-auth-axum --features saml-web --example saml-keycloak-browser
          node tests/browser/saml-keycloak/run.cjs
      - name: Verify actual Keycloak SAML confirmed account deletion
        run: node tests/browser/saml-keycloak/run.cjs --account-deletion
      - run: node tests/browser/oidc/signin-client.cjs
      - name: Build and check supported OIDC startup composition
        run: |
          cargo build --locked -p easy-auth-server --bin easy-auth
          cp target/debug/easy-auth "$RUNNER_TEMP/easy-auth-oidc-disabled"
          cargo build --locked -p easy-auth-server --bin easy-auth --example embedded --features oidc-web
          python3 scripts/smoke_oidc_startup.py
        env:
          EASY_AUTH_OIDC_UNSUPPORTED_TEST_BINARY: ${{ runner.temp }}/easy-auth-oidc-disabled
          EASY_AUTH_SMOKE_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
      - run: cargo check --locked -p easy-auth-server --example oidc-keycloak --features oidc-verification
      - run: cargo build --locked -p easy-auth-server --example oidc-keycloak --features oidc-identities
      - run: node tests/browser/oidc/run.cjs
        env:
          EASY_AUTH_OIDC_IDENTITIES: '1'
      - run: cargo build --locked -p easy-auth-server --example oidc-deletion-http --features experimental-oidc-account-deletion
      - run: node tests/browser/oidc/http-deletion/run.cjs
      - run: cargo build --locked -p easy-auth-server --example oidc-web-native --features oidc-web
      - run: node tests/browser/oidc/web/run.cjs
      - run: cargo build --locked -p easy-auth-axum --example passkey-browser --features passkey-signup
      - run: node tests/browser/passkeys/run.cjs
      - run: cargo build --locked -p easy-auth-server --example passkey-smtp-browser --features experimental-passkeys
      - run: node tests/browser/passkeys/attachment/run.cjs
      - run: cargo build --locked -p easy-auth-server --example passkey-recovery-browser --features experimental-passkey-recovery
      - run: node tests/browser/passkeys/recovery/run.cjs
      - run: cargo build --locked -p easy-auth-server --bin easy-auth
      - run: python3 scripts/smoke_recovery_notice.py
        env:
          EASY_AUTH_SMOKE_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
      - run: cargo install cargo-audit --locked
      - run: python3 scripts/audit.py
      - run: cargo install cargo-deny --locked
      - run: cargo deny --all-features check
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/check_saml_source.py
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

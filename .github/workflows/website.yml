name: Website
on:
  push:
    paths:
      - 'website/**'
      - 'docs/guides/**'
      - 'apps/auth-server/examples/embedded.rs'
      - 'apps/auth-server/examples/embedded/**'
      - '.github/workflows/website.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'docs/guides/**'
      - 'apps/auth-server/examples/embedded.rs'
      - 'apps/auth-server/examples/embedded/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: website
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low
      - run: npm run format:check
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Upload verified static site
        # Verification still runs when a merge explicitly suppresses deployment.
        if: github.repository == 'Deuspheara/easy-auth' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !contains(github.event.head_commit.message, '[skip website deployment]')
        uses: actions/upload-pages-artifact@v4
        with:
          path: website/dist
  deploy:
    if: github.repository == 'Deuspheara/easy-auth' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !contains(github.event.head_commit.message, '[skip website deployment]')
    needs: website
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@v4
